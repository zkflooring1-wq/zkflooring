<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="38" height="38" fill="none">
  <defs>
    <linearGradient id="p1-grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="p1-grad-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="p1-grad-paper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <filter id="p1-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Clipboard Board -->
  <rect x="7" y="6" width="30" height="38" rx="5" fill="url(#p1-grad-bg)" filter="url(#p1-shadow)"/>
  
  <!-- Clipboard Paper -->
  <rect x="10" y="11" width="24" height="30" rx="3" fill="url(#p1-grad-paper)"/>
  
  <!-- Clipboard Clip Top -->
  <rect x="17" y="4" width="10" height="5" rx="2" fill="url(#p1-grad-accent)"/>
  <circle cx="22" cy="6.5" r="1.2" fill="#FFFFFF"/>

  <!-- Blueprint/Floor Grid Lines on Paper -->
  <path d="M14 17h16M14 23h16M14 29h16M14 35h10" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 2"/>
  <path d="M19 17v18M25 17v18" stroke="#E2E8F0" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Site Assessment Floor Outline / Consultation Room Box -->
  <rect x="14" y="19" width="12" height="12" rx="1.5" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <path d="M18 19v12M14 25h12" stroke="#93C5FD" stroke-width="1" stroke-linecap="round"/>

  <!-- Measuring Ruler / Tape across the site -->
  <g transform="translate(20, 24)" filter="url(#p1-shadow)">
    <!-- Measuring Tape Body / Tool -->
    <circle cx="16" cy="12" r="9" fill="url(#p1-grad-accent)"/>
    <circle cx="16" cy="12" r="5" fill="#B45309"/>
    <circle cx="16" cy="12" r="2.5" fill="#FDE68A"/>
    <!-- Tape Extending out -->
    <path d="M8 14h-8v-4h8" fill="#FDE68A" stroke="#D97706" stroke-width="0.8"/>
    <!-- Tape Marks -->
    <path d="M2 10v2M5 10v3M-1 10v2" stroke="#92400E" stroke-width="0.8" stroke-linecap="round"/>
  </g>
</svg>
