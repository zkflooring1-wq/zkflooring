<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="38" height="38" fill="none">
  <defs>
    <linearGradient id="p3-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="p3-handle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="p3-plank" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="p3-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="p3-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Flooring Base Planks being fitted -->
  <g filter="url(#p3-shadow)">
    <!-- Subfloor / Plank 1 -->
    <rect x="6" y="32" width="18" height="10" rx="2" fill="url(#p3-plank)"/>
    <path d="M6 37h18" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    
    <!-- Plank 2 joining Plank 1 -->
    <rect x="26" y="32" width="16" height="10" rx="2" fill="#2563EB"/>
    <path d="M26 37h16" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>

    <!-- Interlock click joint highlight -->
    <path d="M24 33v8" stroke="#FBBF24" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Flooring Installer Mallet / Hammer Tool -->
  <g transform="rotate(-30 20 18)" filter="url(#p3-shadow)">
    <!-- Mallet Rubber Head -->
    <rect x="15" y="6" width="16" height="9" rx="2.5" fill="url(#p3-metal)"/>
    <rect x="17" y="7" width="12" height="7" rx="1.5" fill="#334155"/>
    <path d="M15 8h16M15 13h16" stroke="#64748B" stroke-width="0.8"/>
    <!-- Mallet Handle -->
    <rect x="21.5" y="15" width="3" height="18" rx="1.5" fill="url(#p3-handle)"/>
    <!-- Grip bands -->
    <path d="M21.5 25h3M21.5 28h3M21.5 31h3" stroke="#78350F" stroke-width="1"/>
  </g>

  <!-- Flooring Notched Adhesive Trowel -->
  <g transform="rotate(35 34 16)" filter="url(#p3-shadow)">
    <!-- Trowel Blade with Notches -->
    <path d="M24 10h14l-2 10h-10z" fill="url(#p3-metal)"/>
    <path d="M24 10l1 2h2l1-2h2l1 2h2l1-2h2l1 2" stroke="#475569" stroke-width="1"/>
    <!-- Trowel Handle Mount & Handle -->
    <rect x="29" y="14" width="4" height="4" fill="#64748B"/>
    <rect x="29" y="18" width="4" height="10" rx="2" fill="url(#p3-gold)"/>
  </g>

  <!-- Precision Sparkle -->
  <path d="M8 12l1.5 3.5L13 17l-3.5 1.5L8 22l-1.5-3.5L3 17l3.5-1.5z" fill="#FBBF24"/>
</svg>
