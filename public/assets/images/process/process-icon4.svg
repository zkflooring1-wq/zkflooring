<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="38" height="38" fill="none">
  <defs>
    <linearGradient id="p4-shield-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="p4-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="p4-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Inspection Quality Shield -->
  <g filter="url(#p4-shadow)">
    <!-- Outer Shield Border -->
    <path d="M24 4L9 10v14c0 10.5 6.5 20.2 15 22 8.5-1.8 15-11.5 15-22V10L24 4z" fill="url(#p4-gold)"/>
    <!-- Inner Shield Area -->
    <path d="M24 7L12 12v11.5c0 8.8 5.2 17 12 18.5 6.8-1.5 12-9.7 12-18.5V12L24 7z" fill="url(#p4-shield-bg)"/>
    <!-- Glossy Highlight on Shield -->
    <path d="M24 7L12 12v11.5c0 4.2 1.2 8.3 3.5 11.8L24 7z" fill="rgba(255,255,255,0.18)"/>
  </g>

  <!-- Prominent Inspection Verified Checkmark -->
  <g filter="url(#p4-shadow)">
    <circle cx="24" cy="23" r="10" fill="url(#p4-gold)"/>
    <path d="M19 23l3.5 3.5 7-7" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 3 Stars Rating / Quality Assurance under checkmark -->
  <g fill="#FDE68A" transform="translate(0, 3)">
    <polygon points="24,31 25.2,33.5 28,33.9 26,35.8 26.5,38.5 24,37.2 21.5,38.5 22,35.8 20,33.9 22.8,33.5"/>
    <polygon points="17,29.5 17.8,31.2 19.8,31.5 18.3,32.8 18.7,34.8 17,33.8 15.3,34.8 15.7,32.8 14.2,31.5 16.2,31.2" transform="scale(0.85) translate(4, 2)"/>
    <polygon points="31,29.5 31.8,31.2 33.8,31.5 32.3,32.8 32.7,34.8 31,33.8 29.3,34.8 29.7,32.8 28.2,31.5 30.2,31.2" transform="scale(0.85) translate(3, 2)"/>
  </g>

  <!-- Sparkle Accent Top Right -->
  <path d="M38 6l1 2.5L41.5 9.5 39 10.5 38 13l-1-2.5-2.5-1 2.5-1z" fill="#FBBF24"/>
</svg>
