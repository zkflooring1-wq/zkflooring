<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="38" height="38" fill="none">
  <defs>
    <linearGradient id="p2-wood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="p2-carpet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="p2-vinyl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="p2-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="p2-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Isometric / Layered Swatches of Flooring Samples -->
  <!-- Swatch 3 (Back Vinyl) -->
  <g transform="rotate(-15 24 24)" filter="url(#p2-shadow)">
    <rect x="13" y="10" width="22" height="28" rx="4" fill="url(#p2-vinyl)"/>
    <!-- Subtle tile grid -->
    <path d="M13 24h22M24 10v28" stroke="rgba(255,255,255,0.25)" stroke-width="1.2"/>
  </g>

  <!-- Swatch 2 (Middle Carpet Tile) -->
  <g transform="rotate(10 24 24)" filter="url(#p2-shadow)">
    <rect x="13" y="10" width="22" height="28" rx="4" fill="url(#p2-carpet)"/>
    <!-- Carpet weave texture dots/lines -->
    <circle cx="18" cy="16" r="1" fill="rgba(255,255,255,0.4)"/>
    <circle cx="24" cy="16" r="1" fill="rgba(255,255,255,0.4)"/>
    <circle cx="30" cy="16" r="1" fill="rgba(255,255,255,0.4)"/>
    <circle cx="18" cy="22" r="1" fill="rgba(255,255,255,0.4)"/>
    <circle cx="24" cy="22" r="1" fill="rgba(255,255,255,0.4)"/>
    <circle cx="30" cy="22" r="1" fill="rgba(255,255,255,0.4)"/>
    <circle cx="18" cy="28" r="1" fill="rgba(255,255,255,0.4)"/>
    <circle cx="24" cy="28" r="1" fill="rgba(255,255,255,0.4)"/>
    <circle cx="30" cy="28" r="1" fill="rgba(255,255,255,0.4)"/>
  </g>

  <!-- Swatch 1 (Front Wood / LVT Planks) -->
  <g filter="url(#p2-shadow)">
    <rect x="13" y="10" width="22" height="28" rx="4" fill="url(#p2-wood)"/>
    <!-- Wood grain pattern -->
    <path d="M17 10c2 7 1 14 3 28M27 10c-1 8 0 16-2 28M22 17c1.5 2 1.5 5 0 7" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Swatch Ring / Pivot Pin -->
  <circle cx="24" cy="14" r="2.5" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2"/>
  <circle cx="24" cy="14" r="1" fill="#D97706"/>

  <!-- Selection Check / Sparkle Indicator -->
  <g transform="translate(24, 25)" filter="url(#p2-shadow)">
    <circle cx="13" cy="11" r="7" fill="url(#p2-gold)"/>
    <path d="M10 11l2 2 4-4" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
